$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: paidf-dig-finetune
description: DIG AnomalyGen finetune-only workflow for Azure ML attached AKS compute.
experiment_name: paidf-dig
identity:
  type: managed_identity

code: ../../../
environment:
  image: nvcr.io/nvidia/paidf-anomalygen:1.0.0
compute: azureml:k8s-compute

inputs:
  raw_dataset:
    type: uri_folder
    path: azureml://datastores/datasets/paths/dig/datasets/pcb/raw
    mode: download
  pretrained_model:
    type: uri_folder
    path: azureml://datastores/datasets/paths/dig/models/pretrained
    mode: download
  usecase_model:
    type: uri_folder
    path: azureml://datastores/datasets/paths/dig/models/pcb
    mode: download
  run_name: finetune
  usecase: pcb
  num_gpus: "1"
  min_gpu_memory_gb: "40"
  max_iter: "0"
  save_iter: "0"

outputs:
  finetuned_model:
    type: uri_folder
    path: azureml://datastores/datasets/paths/dig/runs/${{name}}/finetune
    mode: upload

command: >-
  bash workflows/azureml/common/keyvault-env.sh --
  bash workflows/azureml/dig/run-finetune.sh
  --raw-dataset ${{inputs.raw_dataset}}
  --pretrained-model ${{inputs.pretrained_model}}
  --usecase-model ${{inputs.usecase_model}}
  --output-dir ${{outputs.finetuned_model}}
  --name ${{inputs.run_name}}
  --usecase ${{inputs.usecase}}
  --num-gpus ${{inputs.num_gpus}}
  --min-gpu-memory-gb ${{inputs.min_gpu_memory_gb}}
  --max-iter ${{inputs.max_iter}}
  --save-iter ${{inputs.save_iter}}

environment_variables:
  ACCEPT_EULA: "Y"
  PRIVACY_CONSENT: "Y"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  KEY_VAULT_URL: https://placeholder.vault.azure.net
  HF_TOKEN_SECRET_NAME: paidf-hf-token
  NGC_API_KEY_SECRET_NAME: none

resources:
  shm_size: 32g
  instance_type: h100dedicated
