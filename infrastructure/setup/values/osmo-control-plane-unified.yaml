# OSMO 1.3+ unified control plane chart configuration

services:
  ui:
    serviceAccountName: default
    apiHostname: "osmo-service.osmo-control-plane.svc.cluster.local:80"
    ingress:
      prefix: /
      ingressClass: azureml-nginx
      sslEnabled: false
      annotations:
        nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
        nginx.ingress.kubernetes.io/proxy-buffers: "8 16k"
        nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "32k"
        nginx.ingress.kubernetes.io/large-client-header-buffers: "4 16k"
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        memory: "512Mi"

  router:
    scaling:
      minReplicas: 1
      maxReplicas: 2
    serviceAccountName: osmo-control-plane
    ingress:
      prefix: /
      ingressClass: azureml-nginx
      sslEnabled: false
      annotations:
        nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
        nginx.ingress.kubernetes.io/proxy-buffers: "8 16k"
        nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "32k"
        nginx.ingress.kubernetes.io/large-client-header-buffers: "4 16k"
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        memory: "512Mi"

  agent:
    resources:
      requests:
        cpu: "500m"
        memory: "500Mi"
      limits:
        memory: "1Gi"

gateway:
  oauth2Proxy:
    enabled: false
  authz:
    enabled: false
  envoy:
    defaultIdentity:
      user: admin
      roles: osmo-admin
      allowedPools: "*"